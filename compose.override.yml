version: '3.8'

services:
  avito-shop-service:
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - PROJECT_NAME=avito
  db:
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
  adminer:
    image: adminer:latest
    ports:
      - "8800:8080"
    networks:
      - shop-network
    depends_on:
      - db
      - test_db

  test_db:
    image: postgres:13
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shop-network

  test_migrations:
    build:
      context: .
      dockerfile: avito-shop-service/Dockerfile
    command: >
      sh -c "pip install psycopg2-binary && alembic -c alembic_test.ini upgrade head"
    depends_on:
      test_db:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: test_db
      POSTGRES_PORT: 5433
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
      TESTING: "true"
    networks:
      - shop-network
